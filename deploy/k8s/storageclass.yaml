# gp3 volumes for the Kafka brokers (EBS CSI driver add-on from deploy/terraform). Bound in the
# broker's zone, expandable in place, kept if the claim is deleted.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters: { type: gp3, encrypted: "true", iops: "6000", throughput: "500" }
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain
