# Run once before the payments job's first deployment (or after its state is lost): writes 90 days of
# per-account device history from silver.payments into a savepoint (ADR 13). A bounded batch job;
# delete the resource when it has finished.
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: device-history-bootstrap
  namespace: paystream
spec:
  image: REGISTRY/paystream/flink-jobs:VERSION
  flinkVersion: v1_20
  serviceAccount: flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "4"
    fs.s3a.aws.credentials.provider: com.amazonaws.auth.WebIdentityTokenCredentialsProvider
  jobManager:
    resource: { cpu: 1, memory: 2048m }
  taskManager:
    resource: { cpu: 4, memory: 16384m }
  podTemplate:
    spec:
      nodeSelector: { workload: flink }
      tolerations: [{ key: dedicated, value: flink, effect: NoSchedule }]
      containers:
        - name: flink-main-container
          env:
            - { name: ENABLE_BUILT_IN_PLUGINS, value: flink-s3-fs-hadoop-1.20.1.jar }
  job:
    jarURI: local:///opt/paystream/paystream-flink.jar
    entryClass: io.paystream.flink.bootstrap.DeviceHistoryBootstrap
    args:
      - --savepoint
      - s3://CHECKPOINT_BUCKET/bootstrap/device-history
      - --maxParallelism   # must equal the payments job's pipeline.max-parallelism
      - "480"
      - --days
      - "90"
      - --catalogUri
      - http://iceberg-rest:8181
      - --warehouse
      - s3://LAKE_BUCKET/
      - --s3Endpoint
      - ""
      - --s3Region
      - AWS_REGION
    parallelism: 8
    upgradeMode: stateless
    state: running
