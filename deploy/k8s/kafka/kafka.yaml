# Kafka on Kubernetes with the Strimzi operator (0.44+): KRaft, three brokers across zones,
# TLS everywhere, SCRAM-SHA-512 for clients, ACLs per service (users.yaml).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: brokers
  namespace: paystream
  labels: { strimzi.io/cluster: paystream }
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 500Gi
        class: gp3
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests: { cpu: "2", memory: 8Gi }
    limits: { memory: 8Gi }
  jvmOptions: { -Xms: 4g, -Xmx: 4g }
  template:
    pod:
      tolerations: [{ key: dedicated, value: kafka, effect: NoSchedule }]   # the kafka node group
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms: [{ matchExpressions: [{ key: workload, operator: In, values: [kafka] }] }]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: { matchLabels: { strimzi.io/pool-name: brokers } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { strimzi.io/pool-name: brokers } }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: paystream
  namespace: paystream
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.8.0
    metadataVersion: 3.8-IV0
    rack: { topologyKey: topology.kubernetes.io/zone }  # replicas spread over zones; consumers read from the nearest
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication: { type: scram-sha-512 }
    authorization:
      type: simple
      superUsers: [CN=paystream-admin]
    config:
      default.replication.factor: 3
      min.insync.replicas: 2          # with acks=all, a write survives the loss of one broker
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: false  # topics are declared in topics.yaml and reviewed like code
      unclean.leader.election.enable: false
      replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
      transaction.max.timeout.ms: 900000  # Flink's exactly-once sinks hold transactions across checkpoints
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef: { name: kafka-metrics, key: kafka-metrics-config.yml }
  entityOperator:
    topicOperator: {}
    userOperator: {}
  cruiseControl: {}   # rebalances partitions when brokers are added or removed
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"   # consumer lag per group, the main alerting signal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics
  namespace: paystream
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
        labels: { clientId: "$3", topic: "$4", partition: "$5" }
      - pattern: kafka.server<type=(.+), name=(.+)><>(Count|Value)
        name: kafka_server_$1_$2
      - pattern: kafka.network<type=(.+), name=(.+), request=(.+)><>(Count|99thPercentile)
        name: kafka_network_$1_$2
        labels: { request: "$3" }
