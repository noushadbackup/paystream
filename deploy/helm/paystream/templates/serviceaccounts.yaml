{{- $roles := dict "decision-service" .Values.serviceAccounts.modelsReader "iceberg-rest" .Values.serviceAccounts.lakeCatalog }}
{{- range $name := list "decision-service" "rules-service" "case-service" "ops-console" "schema-registry" "iceberg-rest" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "paystream.labels" $ | nindent 4 }}
  {{- with get $roles $name }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . }}
  {{- end }}
automountServiceAccountToken: {{ hasKey $roles $name }}   # only pods that exchange it for AWS credentials
{{- end }}
