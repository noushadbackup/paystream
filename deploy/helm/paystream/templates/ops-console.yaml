{{- $v := .Values.opsConsole }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-console
  labels:
    app: ops-console
    {{- include "paystream.labels" . | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector: { matchLabels: { app: ops-console } }
  template:
    metadata: { labels: { app: ops-console } }
    spec:
      serviceAccountName: ops-console
      containers:
        - name: console
          image: {{ include "paystream.image" (dict "root" . "name" "ops-console") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8501 }]
          env:
            - { name: TRINO_HOST, value: {{ $v.trinoHost | quote }} }
            - { name: CASES_URL, value: "http://case-service:8097" }
            - name: PAYSTREAM_CASES_TOKEN
              valueFrom: { secretKeyRef: { name: ops-console, key: cases-token } }
            - { name: HOME, value: /tmp }
          readinessProbe: { httpGet: { path: /_stcore/health, port: http }, periodSeconds: 10 }
          resources: {{- toYaml $v.resources | nindent 12 }}
          {{- include "paystream.securityContext" . | nindent 10 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: ops-console, labels: { app: ops-console } }
spec:
  selector: { app: ops-console }
  ports: [{ name: http, port: 8501, targetPort: http }]
