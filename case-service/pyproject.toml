[project]
name = "paystream-cases"
version = "0.1.0"
description = "PayStream case management: alerts and held payments become cases; analyst verdicts become labels and account actions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "orjson>=3.10",
]

[project.optional-dependencies]
kafka = ["confluent-kafka[avro,schemaregistry]>=2.5", "redis>=5.0"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "httpx>=0.27", "fakeredis>=2.23"]

[project.scripts]
paystream-cases = "paystream_cases.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
