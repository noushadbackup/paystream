[project]
name = "paystream-decision"
version = "0.1.0"
description = "PayStream decision service: approve, challenge, review or decline a payment in the authorisation path"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "redis[hiredis]>=5.0",
  "orjson>=3.10",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.5"]
loadtest = ["aiohttp>=3.9"]
dev = ["pytest>=8", "httpx>=0.27", "fakeredis>=2.23"]

[project.scripts]
paystream-decision-loadtest = "paystream_decision.loadtest:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
