name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "generator[dev]"
      - name: Lint
        run: ruff check generator rules-service decision-service case-service ml dashboard benchmarks dbt/ci airflow/dags
      - name: Tests (incl. Avro contract and backward compatibility)
        run: cd generator && pytest -q

  rules-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "rules-service[dev]"
      - name: Workflow, audit chain, API, and the shared conformance vectors (Flink runs the same ones)
        run: cd rules-service && pytest -q

  decision-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "decision-service[dev]"
      - name: Features, policy, degraded mode, decision-log contract
        run: cd decision-service && pytest -q

  case-service:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "case-service[dev,kafka]"
      - name: Case workflow, suppression, outbox retries, freeze and clearance against a real Redis
        env: { PAYSTREAM_TEST_REDIS: "redis://localhost:6379/3" }
        run: cd case-service && pytest -q

  flink:
    runs-on: ubuntu-latest
    services:
      redis:  # the online-store sink test writes to a real Redis
        image: redis:7.4
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: Unit tests + end-to-end pipeline into a local Iceberg catalog
        run: cd flink-jobs && mvn -B -q verify

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: >-
          pip install -e generator -e "rules-service[dev]" -e case-service -e decision-service -e "ml[dev]"
          "dbt-core>=1.10,<2" dbt-duckdb -r dashboard/requirements.txt
      - name: Model tests (served evaluator == LightGBM, metrics, promotion gates, drift, replay)
        run: cd ml && pytest -q
      - name: Fixture from the generator; decision log replayed through the decision service's own code
        run: |
          cd dbt
          python ci/build_fixture.py
          paystream-ml replay --duckdb ci/ci.duckdb
      - name: Model lifecycle on the fixture (train, promote, a second challenger, drift), then rescore the log
        run: |
          paystream-ml train --duckdb dbt/ci/ci.duckdb --registry models --holdout 0.25 --budget 0.05
          paystream-ml promote --duckdb dbt/ci/ci.duckdb --registry models --budget 0.05
          paystream-ml train --duckdb dbt/ci/ci.duckdb --registry models --holdout 0.25 --budget 0.05 --params '{"num_leaves": 15}'
          paystream-ml promote --duckdb dbt/ci/ci.duckdb --registry models --budget 0.05
          paystream-ml drift --duckdb dbt/ci/ci.duckdb --registry models --days 0.01
          test -s models/champion
          paystream-ml replay --duckdb dbt/ci/ci.duckdb --registry models
      - name: Gold models + data tests on DuckDB
        run: cd dbt && dbt build --profiles-dir . --target duckdb
      - name: Ops console queries and the Cases tab demo backend against the dbt output
        run: pytest -q dashboard/tests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose file is valid
        run: docker compose --profile batch --profile load config -q
      - name: Airflow DAGs compile
        run: python -m py_compile airflow/dags/*.py

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.2 }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.10.5 }
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      - name: Helm chart lints and renders to valid Kubernetes objects
        run: |
          helm lint deploy/helm/paystream --strict
          helm template paystream deploy/helm/paystream --set metrics.serviceMonitor=true \
            | kubeconform -strict -summary -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
      - name: Strimzi and Flink operator manifests match their CRDs
        run: |
          kubeconform -strict -summary -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' deploy/k8s
      - name: Terraform is formatted and valid
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
