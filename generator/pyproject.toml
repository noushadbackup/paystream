[project]
name = "paystream-gen"
version = "0.1.0"
description = "Synthetic mobile financial services (MFS) traffic for PayStream: payments, late and duplicate events, labelled fraud scenarios."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
kafka = ["confluent-kafka[avro,schemaregistry]>=2.5", "fastavro>=1.9", "httpx>=0.27", "attrs>=23", "cachetools>=5", "authlib>=1.3"]
ledger = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "fastavro>=1.9", "ruff>=0.6"]

[project.scripts]
paystream-gen = "paystream_gen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
