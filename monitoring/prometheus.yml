global:
  scrape_interval: 5s
scrape_configs:
  - job_name: flink
    static_configs:
      - targets: ["jobmanager:9249", "taskmanager:9249"]
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: decision-service
    metrics_path: /metrics
    static_configs:
      - targets: ["decision-service:8095"]
